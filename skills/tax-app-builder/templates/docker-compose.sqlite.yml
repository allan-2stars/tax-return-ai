services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/tax-return-ai.db
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/uploads
      AI_PROVIDER: mock
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
