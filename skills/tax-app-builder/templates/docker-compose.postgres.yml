services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tax_return_ai
      POSTGRES_USER: taxapp
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://taxapp:change-me@postgres:5432/tax_return_ai
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /data/uploads
      AI_PROVIDER: mock
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
