# tax-return-ai — Docker Compose (production mode)
# Uses production Dockerfiles with health checks and auto-restart.
# Dev Dockerfiles (Dockerfile.dev) are kept alongside for development.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/taxapp.db}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_LOCAL_PATH=${STORAGE_LOCAL_PATH:-./data/uploads}
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - OCR_PROVIDER=${OCR_PROVIDER:-mock}
      - EDITION=${EDITION:-personal}
      - FINANCIAL_YEAR=${FINANCIAL_YEAR:-2025-2026}
      - REDACT_SENSITIVE_LOGS=${REDACT_SENSITIVE_LOGS:-true}
      - TELEMETRY_ENABLED=${TELEMETRY_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      backend:
        condition: service_healthy
